name: tournament_platform
description: Tournament Operations — Flutter client for the Django API backend.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3
  web_socket_channel: ^2.4.0

  # Secure token storage (never shared_preferences for JWTs)
  flutter_secure_storage: ^9.2.2

  # Routing + route guards
  go_router: ^14.2.0

  # PDF download/open/share
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  share_plus: ^9.0.0

  # Formatting (dates/times for schedule & scoring screens)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
